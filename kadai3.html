<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>AR変身スタジオ</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .ar-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        button {
            font-size: 18px;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="hud">
        <button id="mazyobouBtn">魔女の帽子</button>
        <button id="oukanBtn">王冠</button>
        <button id="sirukuBtn">シルクハット</button>
        <button id="hideBtn">非表示</button>
        <button id="effectBtn">エフェクトOFF</button>
    </div>

    <div class="ar-container">
        <a-scene
            mindar-face
            embedded
            color-space="sRGB"
            renderer="colorManagement: true; physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-assets>
                <a-asset-item
                    id="mazyobouModel"
                    src="mazyobou.glb">
                </a-asset-item>

                <a-asset-item
                    id="oukanModel"
                    src="oukan.glb">
                </a-asset-item>

                <a-asset-item
                    id="sirukuModel"
                    src="siruku.glb">
                </a-asset-item>
            </a-assets>

            <a-entity mindar-face-target="anchorIndex: 168">

            <a-entity
                id="starEffect"
                position="0 0.7 0"
                visible="true"
                animation="property: rotation;
                to: 0 360 0;
                loop: true;
                dur: 5000;
                easing: linear">

            <a-entity
                geometry="primitive: torusKnot; radius: 0.08; radiusTubular: 0.015"
                material="color: gold"
                position="0.5 0 0">
            </a-entity>

            <a-entity
                geometry="primitive: torusKnot; radius: 0.08; radiusTubular: 0.015"
                material="color: yellow"
                position="-0.5 0 0">
            </a-entity>

            <a-entity
                geometry="primitive: torusKnot; radius: 0.08; radiusTubular: 0.015"
                material="color: orange"
                position="0 0 -0.5">
            </a-entity>

            </a-entity>
                <a-gltf-model
                    id="mazyobou"
                    src="#mazyobouModel"
                    position="0 0.3 -2"
                    rotation="0 0 0"
                    scale="0.4 0.4 0.4"
                    visible="false">
                </a-gltf-model>

                <a-gltf-model
                    id="oukan"
                    src="#oukanModel"
                    position="0 0.7 -1"
                    rotation="0 0 0"
                    scale="0.7 0.7 0.7"
                    visible="false">
                </a-gltf-model>

                <a-gltf-model
                    id="siruku"
                    src="#sirukuModel"
                    position="0 0.5 -2"
                    rotation="0 0 0"
                    scale="0.13 0.13 0.13"
                    visible="false">
                </a-gltf-model>

            </a-entity>

            <a-camera
                active="false"
                position="0 0 0"
                look-controls="enabled: false">
            </a-camera>

        </a-scene>
    </div>
    <script>
        const mazyobou = document.getElementById("mazyobou");
        const oukan = document.getElementById("oukan");
        const siruku = document.getElementById("siruku");

        const mazyobouBtn = document.getElementById("mazyobouBtn");
        const oukanBtn = document.getElementById("oukanBtn");
        const sirukuBtn = document.getElementById("sirukuBtn");
        const hideBtn = document.getElementById("hideBtn");

        const starEffect = document.getElementById("starEffect");
        const effectBtn = document.getElementById("effectBtn");

        function toMazyobou() {
            mazyobou.setAttribute("visible", true);
            oukan.setAttribute("visible", false);
            siruku.setAttribute("visible", false);
            console.log("魔女の帽子を表示しました");
        }

        function toOukan() {
            mazyobou.setAttribute("visible", false);
            oukan.setAttribute("visible", true);
            siruku.setAttribute("visible", false);
            console.log("王冠を表示しました");
        }
    
        function toSiruku() {
            mazyobou.setAttribute("visible", false);
            oukan.setAttribute("visible", false);
            siruku.setAttribute("visible", true);
            console.log("シルクハットを表示しました");
        }

        function hideAll() {
            mazyobou.setAttribute("visible", false);
            oukan.setAttribute("visible", false);
            siruku.setAttribute("visible", false);
            console.log("すべて非表示にしました");
        }

        mazyobouBtn.addEventListener(
            "click", toMazyobou
        );
        oukanBtn.addEventListener(
            "click", toOukan
        );
        sirukuBtn.addEventListener(
            "click", toSiruku
        );
        hideBtn.addEventListener(
            "click", hideAll
        );
        effectBtn.addEventListener("click", function() {
            const isVisible = starEffect.getAttribute("visible");
            if (isVisible) {
                starEffect.setAttribute("visible", false);
                effectBtn.textContent = "エフェクトON";
        } else {
                starEffect.setAttribute("visible", true);
                effectBtn.textContent = "エフェクトOFF";
        }
    });
    </script>
</body>
</html>
