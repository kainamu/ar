
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>ARタッチピアノ</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

</head>

<body>
    <a-scene hands id="scene">

        <!-- ド -->
        <a-plane id="do"
            color="white"
            width="0.4" height="1.3"
            position="-1.4 0 -2">
        </a-plane>

        <!-- レ -->
        <a-plane id="re"
            color="white"
            width="0.4" height="1.3"
            position="-1 0 -2">
        </a-plane>

        <!-- ミ -->
        <a-plane id="mi"
            color="white"
            width="0.4" height="1.3"
            position="-0.6 0 -2">
        </a-plane>

        <!-- ファ -->
        <a-plane id="fa"
            color="white"
            width="0.4" height="1.3"
            position="-0.2 0 -2">
        </a-plane>

        <!-- ソ -->
        <a-plane id="so"
            color="white"
            width="0.4" height="1.3"
            position="0.2 0 -2">
        </a-plane>

        <!-- ラ -->
        <a-plane id="ra"
            color="white"
            width="0.4" height="1.3"
            position="0.6 0 -2">
        </a-plane>

        <!-- シ -->
        <a-plane id="si"
            color="white"
            width="0.4" height="1.3"
            position="1 0 -2">
        </a-plane>

        <!-- 高いド -->
        <a-plane id="do8"
            color="white"
            width="0.4" height="1.3"
            position="1.4 0 -2">
        </a-plane>

        <a-camera position="0 0 0"></a-camera>

    </a-scene>

    <script>

        const scene = document.getElementById("scene");

        // 鍵盤
        const keys = [
            { id: "do", file: "1-1do.mp3" },
            { id: "re", file: "1-2re.mp3" },
            { id: "mi", file: "1-3mi.mp3" },
            { id: "fa", file: "1-4fa.mp3" },
            { id: "so", file: "1-5so.mp3" },
            { id: "ra", file: "1-6ra.mp3" },
            { id: "si", file: "1-7si.mp3" },
            { id: "do8", file: "1_8do.mp3" }
        ];

        const sounds = {};
        const wasInside = {};

        keys.forEach(key => {

            sounds[key.id] =
                new Audio("./piano/" + key.file);

            wasInside[key.id] = false;

        });

        function playPiano() {

            const hands = scene.components.hands;

            if (!hands) return;

            keys.forEach(key => {

                const pianoKey =
                    document.getElementById(key.id);

                const inside =
                    hands.isPointOnEntity(8, pianoKey);

                if (inside && !wasInside[key.id]) {

                    sounds[key.id].currentTime = 0;
                    sounds[key.id].play();

                    pianoKey.setAttribute(
                        "color", "aquamarine"
                    );
                }

                if (!inside && wasInside[key.id]) {

                    pianoKey.setAttribute(
                        "color", "white"
                    );
                }

                wasInside[key.id] = inside;

            });
        }

        scene.addEventListener(
            "hand-result",
            playPiano
        );

    </script>

</body>
</html>
