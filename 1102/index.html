
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Tracking AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .ar-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        #hud{
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }
        button{
            font-size: 18px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="hud">
        <button id="megane1Btn">メガネ１</button>
        <button id="megane2Btn">メガネ２</button>
    </div>
    <div class="ar-container">

        <a-scene
            mindar-face
            embedded
            color-space="sRGB"
            renderer="colorManagement: true; physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <!-- 顔に表示するアイテム -->
            <a-entity mindar-face-target="anchorIndex: 168">
                <a-gltf-model
                    id="accessory"    
                ></a-gltf-model>

            </a-entity>

            <!-- 仮想カメラ -->
            <a-camera
                active="false"
                position="0 0 0"
                look-controls="enabled: false">
            </a-camera>

        </a-scene>
        <script>
            const accessory=document.getElementById("accessory");
            const megane1Btn=document.getElementById("megane1Btn");
            const megane2Btn=document.getElementById("megane2Btn");

            function toMegane2(){
                accessory.setAttribute("src","megane2.glb");
                accessory.setAttribute("position","0 0 -0.2");
                accessory.setAttribute("rotation","0 0 0");
                accessory.setAttribute("scale","0.65 0.65 0.65");
            }
            megane2Btn.addEventListener("click",toMegane2);

            function toMegane1(){
                 accessory.setAttribute("src","megane1.glb");
                accessory.setAttribute("position","-0.07 0 -0.3");
                accessory.setAttribute("rotation","0 -180 0");
                accessory.setAttribute("scale","0.7 0.7 0.7");
            }
            megane1Btn.addEventListener("click",toMegane1);
        </script>
    </div>

</body>
</html>
