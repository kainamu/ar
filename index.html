            <a-octahedron id="alchemyStone" position="0 2 0" radius="0.5" color="purple" visible="false" animation="
        property: rotation;
        to: 0 360 0;
        loop: true;
        dur: 3000;
        easing: linear;" animation__float="
        property: position;
        from: 0 1.8 0;
        to: 0 2.5 0;
        dir: alternate;
        loop: true;
        dur: 1200;
        easing: easeInOutSine;">
            </a-octahedron>
        </a-entity>


        <!-- 部屋をつなぐ通路 -->
        <a-plane position="0 0 -7" rotation="-90 0 0" width="5" height="8" color="#292929">
        </a-plane>
        <a-plane position="0 0 7" rotation="-90 0 0" width="5" height="8" color="#292929">
        </a-plane>
        <a-plane position="-7 0 0" rotation="-90 0 0" width="8" height="5" color="#292929">
        </a-plane>
        <a-plane position="7 0 0" rotation="-90 0 0" width="8" height="5" color="#292929">
        </a-plane>

        <!--部屋名 -->
        <a-text value="MAGIC SHOOTING" position="-2 2 -18" color="white" width="5">
        </a-text>
        <a-text value="LIBRARY" position="-17 2 -2" rotation="0 90 0" color="white" width="5">
        </a-text>
        <a-text value="ELEMENT MAGIC" position="17 2 2" rotation="0 -90 0" color="white" width="5">
        </a-text>
        <a-text value="ALCHEMY LAB" position="-2 2 18" rotation="0 180 0" color="white" width="5">
        </a-text>


        <!-- プレイヤー -->
        <a-entity position="0 1.6 16">
            <a-camera wasd-controls look-controls>
            </a-camera>
        </a-entity>

        <script>
            // 中央クリスタル・魔法陣
            const crystal =
                document.getElementById("crystal");

            const centerMagicCircle =
                document.getElementById("centerMagicCircle");

            const centerMagicLight =
                document.getElementById("centerMagicLight");

            const centerMagicText =
                document.getElementById("centerMagicText");

            crystal.addEventListener("click", function () {

                // クリスタルを紫色にする
                crystal.setAttribute(
                    "material",
                    "color",
                    "#cc66ff"
                );

                // クリスタルを少し大きくする
                crystal.setAttribute(
                    "scale",
                    "1.5 1.5 1.5"
                );


                // 高速回転
                crystal.setAttribute(
                    "animation",
                    {
                        property: "rotation",
                        to: "0 720 0",
                        loop: true,
                        dur: 1500,
                        easing: "linear"
                    }
                );

                // 魔法陣を大きくする
                centerMagicCircle.setAttribute(
                    "scale",
                    "1.2 1.2 1.2"
                );

                // 魔法陣を回転
                centerMagicCircle.setAttribute(
                    "animation",
                    {
                        property: "rotation",
                        to: "-90 0 360",
                        loop: true,
                        dur: 4000,
                        easing: "linear"
                    }
                );

                // 紫色の光を発生
                centerMagicLight.setAttribute(
                    "intensity",
                    "3"
                );


                // 起動メッセージ
                centerMagicText.setAttribute(
                    "visible",
                    true
                );

            });

            // 属性魔法
            const fireStone =
                document.getElementById("fireStone");

            const iceStone =
                document.getElementById("iceStone");

            const thunderStone =
                document.getElementById("thunderStone");


            // 炎
            fireStone.addEventListener("click", function () {
                fireStone.setAttribute(
                    "scale",
                    "1.5 1.5 1.5"
                );
            });


            // 氷
            iceStone.addEventListener("click", function () {
                iceStone.setAttribute(
                    "color",
                    "white"
                );
            });

            // 雷
            thunderStone.addEventListener("click", function () {
                thunderStone.setAttribute(
                    "animation",
                    {
                        property: "rotation",
                        to: "0 -360 0",
                        loop: true,
                        dur: 800,
                        easing: "linear"
                    }
                );
            });

            // 魔法射撃
            let monsterHP = 30;
            const magicBall =
                document.getElementById("magicBall");
            const monster =
                document.getElementById("monster");
            const hpText =
                document.getElementById("hpText");

            // 魔法弾発射
            function shootMagic() {
                const power = -30;
                magicBall.body.applyImpulse(
                    new CANNON.Vec3(
                        0,
                        0,
                        power
                    ),
                    magicBall.body.position
                );
            }
            magicBall.addEventListener(
                "click",
                shootMagic
            );

            // モンスターに当たった
            function magicHit(event) {
                const enemy =
                    event.detail.body.el;
                if (enemy.classList.contains("target")) {
                    monsterHP =
                        monsterHP - 3
                    if (monsterHP < 0) {

                        monsterHP = 0;

                    }
                    // HP表示
                    hpText.setAttribute(
                        "value",
                        "HP: " + monsterHP
                    );

                    // ダメージで赤くする
                    monster.setAttribute(
                        "color",
                        "red"
                    );

                    // HP 0
                    if (monsterHP <= 0) {
                        monster.setAttribute(
                            "visible",
                            false
                        );
                        hpText.setAttribute(
                            "value",
                            "DEFEATED!"
                        );
                        hpText.setAttribute(
                            "color",
                            "yellow"
                        );

                    }

                    // 魔法弾を発射台へ戻す
                    setTimeout(function () {
                        magicBall.body.velocity.set(
                            0,
                            0,
                            0
                        );
                        magicBall.body.angularVelocity.set(
                            0,
                            0,
                            0
                        );
                        magicBall.body.position.set(
                            0,
                            1.6,
                            -10.5
                        );
                    }, 500);

                }

            }
            magicBall.addEventListener(
                "collide",
                magicHit
            );

            // 石壁テクスチャ
            const stoneWalls =
                document.querySelectorAll(".stoneWall");
            stoneWalls.forEach(function (wall) {
                wall.setAttribute(
                    "material",
                    "src: #stoneWall; repeat: 3 2"
                );
            });

            // 調合システム
            const redPotion =
                document.getElementById("redPotion");
            const bluePotion =
                document.getElementById("bluePotion");
            const greenPotion =
                document.getElementById("greenPotion");
            const cauldronLiquid =
                document.getElementById("cauldronLiquid");
            const alchemyStone =
                document.getElementById("alchemyStone");
            let firstPotion = "";


            redPotion.addEventListener("click", function (event) {

                event.stopPropagation();

                addPotion("red");

            });

            bluePotion.addEventListener("click", function (event) {

                event.stopPropagation();

                addPotion("blue");

            });

            greenPotion.addEventListener("click", function (event) {

                event.stopPropagation();

                addPotion("green");

            });

            function addPotion(color) {

                if (firstPotion == "") {
                    firstPotion = color;
                    alchemyStone.setAttribute(
                        "visible",
                        false
                    );
                    changeCauldron(color);
                    return;
                }
                if (firstPotion == color) {
                    return;

                }
                mixPotion(
                    firstPotion,
                    color
                );
                firstPotion = "";
            }
            function changeCauldron(color) {
                if (color == "red") {
                    cauldronLiquid.setAttribute(
                        "color",
                        "#ff4444"
                    );
                }
                else if (color == "blue") {
                    cauldronLiquid.setAttribute(
                        "color",
                        "#44bbff"
                    );
                }
                else if (color == "green") {
                    cauldronLiquid.setAttribute(
                        "color",
                        "#55dd77"
                    );
                }
            }

            function mixPotion(first, second) {
                let resultColor = "";
                if (
                    (first == "red" && second == "blue") ||
                    (first == "blue" && second == "red")
                ) {
                    resultColor = "#bb55ff";
                }
          else if (
                    (first == "blue" && second == "green") ||
                    (first == "green" && second == "blue")
                ) {

                    resultColor = "#44ffff";
                }

                else if (
                    (first == "red" && second == "green") ||
                    (first == "green" && second == "red")
                ) {

                    resultColor = "#ffff44";

                }

                cauldronLiquid.setAttribute(
                    "color",
                    resultColor
                );

                alchemyStone.setAttribute(
                    "color",
                    resultColor
                );

                alchemyStone.setAttribute(
                    "visible",
                    true
                );

            }
            const magicBook =
                document.getElementById("magicBook");

            const bookMagic =
                document.getElementById("bookMagic");

            const bookMagicText =
                document.getElementById("bookMagicText");


            magicBook.addEventListener("click", function () {

                // 魔法球を大きくする
                bookMagic.setAttribute(
                    "scale",
                    "3 3 3"
                );
                // 魔法球を紫色にする
                bookMagic.setAttribute(
                    "color",
                    "#cc66ff"
                );
                // 本を光らせる
                magicBook.setAttribute(
                    "color",
                    "#9933ff"
                );

                // 文字を表示
                bookMagicText.setAttribute(
                    "visible",
                    true
                );
            });
        </script>
    </a-scene>
</body>
</html>
