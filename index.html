<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiroとKanjiのAR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <!-- Hiro: カラーボックス -->
    <a-marker preset="hiro">
    <a-box position="0 0 -0.5" scale="0.3 0.3 0.3" color="red"></a-box>
    <a-box position="0 0 0" scale="0.3 0.3 0.3" color="teal"></a-box>
    <a-box position="-0.5 0 0" scale="0.3 0.3 0.3" color="darkviolet"></a-box>
    <a-box position="0.5 0 0.5" scale="0.3 0.3 0.3" color="blue"></a-box>
    <a-box position="0 0 0.5" scale="0.3 0.3 0.3" color="pink"></a-box>
    <a-box position="-0.5 0 0.5" scale="0.3 0.3 0.3" color="aqua"></a-box>
    <a-box position="0.5 0 -0.5" scale="0.3 0.3 0.3" color="orange"></a-box>
    <a-box position="0.5 0 0" scale="0.3 0.3 0.3" color="yellow"></a-box>
    <a-box position="-0.5 0 -0.5" scale="0.3 0.3 0.3" color="lime"></a-box>
    </a-marker>
    <!-- Kanji: ロボット -->
    <a-marker preset="kanji">
      <!-- ロボット全体 -->
    <a-entity id="robot" position="0 0.07 0" rotation="-70 0 0" scale="0.15 0.15 0.15">

        <!-- ===== 頭 ===== -->
        <a-entity id="head">

            <!-- 頭本体 -->
            <a-box
                position="0 4.5 0"
                width="1.1"
                height="0.9"
                depth="0.9"
                color="white">
            </a-box>

            <!-- 顔 -->
            <a-box
                position="0 4.35 0.47"
                width="0.7"
                height="0.4"
                depth="0.08"
                color="lightgray">
            </a-box>

            <!-- 左目 -->
            <a-box
                position="-0.2 4.5 0.53"
                width="0.2"
                height="0.1"
                depth="0.05"
                color="yellow">
            </a-box>

            <!-- 右目 -->
            <a-box
                position="0.2 4.5 0.53"
                width="0.2"
                height="0.1"
                depth="0.05"
                color="yellow">
            </a-box>

            <!-- 赤い額 -->
            <a-box
                position="0 4.85 0.48"
                width="0.25"
                height="0.25"
                depth="0.1"
                color="red">
            </a-box>

            <!-- V字アンテナ -->
            <a-box
                position="-0.38 5.15 0.1"
                width="0.08"
                height="0.9"
                depth="0.08"
                rotation="0 0 -45"
                color="yellow">
            </a-box>

            <a-box
                position="0.38 5.15 0.1"
                width="0.08"
                height="0.9"
                depth="0.08"
                rotation="0 0 45"
                color="yellow">
            </a-box>

        </a-entity>


        <!-- ===== 胴体 ===== -->
        <a-entity id="body">

            <!-- 胸 -->
            <a-box
                position="0 3.1 0"
                width="2"
                height="1.6"
                depth="1"
                color="blue">
            </a-box>

            <!-- 胸中央 -->
            <a-box
                position="0 3.2 0.53"
                width="0.65"
                height="0.7"
                depth="0.1"
                color="red">
            </a-box>

            <!-- 腰 -->
            <a-box
                position="0 2 0"
                width="1.5"
                height="0.6"
                depth="0.9"
                color="white">
            </a-box>

            <!-- 腰中央 -->
            <a-box
                position="0 2 0.48"
                width="0.5"
                height="0.5"
                depth="0.1"
                color="yellow">
            </a-box>

        </a-entity>


        <!-- ===== 左腕 ===== -->
        <a-entity id="left-arm">

            <!-- 肩 -->
            <a-box
                position="-1.35 3.4 0"
                width="0.7"
                height="0.7"
                depth="1"
                color="white">
            </a-box>

            <!-- 腕 -->
            <a-box
                position="-1.4 2.6 0"
                width="0.5"
                height="1.1"
                depth="0.6"
                color="lightgray">
            </a-box>

            <!-- 手 -->
            <a-box
                position="-1.4 1.9 0"
                width="0.55"
                height="0.45"
                depth="0.6"
                color="gray">
            </a-box>

        </a-entity>


        <!-- ===== 右腕 ===== -->
        <a-entity id="right-arm">

            <!-- 肩 -->
            <a-box
                position="1.35 3.4 0"
                width="0.7"
                height="0.7"
                depth="1"
                color="white">
            </a-box>

            <!-- 腕 -->
            <a-box
                position="1.4 2.6 0"
                width="0.5"
                height="1.1"
                depth="0.6"
                color="lightgray">
            </a-box>

            <!-- 手 -->
            <a-box
                position="1.4 1.9 0"
                width="0.55"
                height="0.45"
                depth="0.6"
                color="gray">
            </a-box>

        </a-entity>


        <!-- ===== 左脚 ===== -->
        <a-entity id="left-leg">

            <!-- 太もも -->
            <a-box
                position="-0.55 1.25 0"
                width="0.65"
                height="1.2"
                depth="0.75"
                color="white">
            </a-box>

            <!-- すね -->
            <a-box
                position="-0.55 0.3 0"
                width="0.75"
                height="0.8"
                depth="0.85"
                color="lightgray">
            </a-box>

            <!-- 足 -->
            <a-box
                position="-0.55 -0.25 0.2"
                width="0.8"
                height="0.35"
                depth="1.2"
                color="red">
            </a-box>

        </a-entity>


        <!-- ===== 右脚 ===== -->
        <a-entity id="right-leg">

            <!-- 太もも -->
            <a-box
                position="0.55 1.25 0"
                width="0.65"
                height="1.2"
                depth="0.75"
                color="white">
            </a-box>

            <!-- すね -->
            <a-box
                position="0.55 0.3 0"
                width="0.75"
                height="0.8"
                depth="0.85"
                color="lightgray">
            </a-box>

            <!-- 足 -->
            <a-box
                position="0.55 -0.25 0.2"
                width="0.8"
                height="0.35"
                depth="1.2"
                color="red">
            </a-box>

        </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
